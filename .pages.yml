            type: string
            required: true
            list: true
            pattern:
              regex: '^https?://\S+$'
              message: "Cada perfil debe ser una URL completa (https://…)."
          - name: youtube
            label: "YouTube"
            type: string
            required: true
            pattern:
              regex: '^https?://\S+$'
              message: "Pegá una URL completa (https://…)."
          - name: soundcloud
            label: "SoundCloud"
            type: string
            required: true
            pattern:
              regex: '^https?://\S+$'
              message: "Pegá una URL completa (https://…)."
      - name: genres
        label: "Géneros"

            required: true
            pattern:
              regex: '^[^\s@]+@[^\s@]+\.[^\s@]+$'
              message: "Ingresá un email válido."
          - name: whatsapp
            label: "WhatsApp"
            description: "URL completa de WhatsApp o de wa.link."
            type: string
            required: true
            pattern:
              regex: '^https?://\S+$'
              message: "Pegá una URL completa (https://…)."
          - name: instagram

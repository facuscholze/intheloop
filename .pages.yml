# Pages CMS — administración de contenido de In The Loop / Tommy Petersen
#
# Shows, galerías por ciudad, tracks y datos del sitio.
# La estructura reproduce las carpetas reales que leen los loaders de
# src/lib/content.ts: content/shows/<show>/show.json,
# content/gallery/<ciudad>/city.json, content/songs/<track>/track.json
# y content/site.json.
#
# settings.content.merge conserva claves JSON que no están expuestas en los
# formularios (por ejemplo, id/photo heredados) al guardar una entrada.
settings:
  content:
    merge: true

media:
  - name: shows
    label: "Fotos de shows"
    input: content/shows
    output: /media/content/shows
    extensions: [jpg, jpeg, png, webp, avif, gif, tif, tiff]
    rename: safe
  - name: galeria
    label: "Fotos de galería"
    input: content/gallery
    output: /media/content/gallery
    extensions: [jpg, jpeg, png, webp, avif, gif, tif, tiff]
    rename: safe
  - name: tracks
    label: "Audio y portadas de tracks"
    input: content/songs
    output: /media/content/songs
    extensions: [jpg, jpeg, png, webp, avif, gif, tif, tiff, mp3, wav, m4a, aac, ogg, oga, opus, flac, aiff]
    rename: safe

content:
  - name: shows
    label: "Shows"
    description: "Cada show es una carpeta con su show.json. Creá los shows desde la raíz de esta colección."
    type: collection
    path: content/shows
    format: json
    subfolders: true
    filename: "{fields.date}-{fields.venue}/show.json"
    exclude: ["_TEMPLATE"]
    view:
      layout: tree
      node: show.json
      fields: [venue, date, city, country, featured, draft]
      primary: venue
      sort: [date, venue, city, country]
      search: [venue, city, country, date]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: venue
        label: "Venue / evento"
        description: "Nombre del lugar o evento, tal como debe aparecer en el sitio."
        type: string
        required: true
      - name: date
        label: "Fecha"
        description: "Fecha del show. Se guarda como AAAA-MM-DD."
        type: date
        required: true
        default: ""
        options:
          format: "yyyy-MM-dd"
      - name: city
        label: "Ciudad"
        description: "Ciudad donde fue o será el show."
        type: string
      - name: country
        component: pais
        required: true
      - name: hero
        label: "Foto principal"
        description: "Guardá primero el show y volvé a abrirlo. Usá Select, entrá a la carpeta de este show y subí o elegí la foto ahí; no uses Upload directo ni arrastrarla en este campo."
        type: image
        options:
          media: shows
          path: content/shows
          rename: safe
      - name: instagram
        label: "Instagram"
        description: "URL completa del venue o del evento. Podés dejarlo vacío."
        type: string
        pattern:
          regex: '^$|^https?://\S+$'
          message: "Pegá una URL completa (https://…) o dejá el campo vacío."
      - name: galleryUrl
        label: "Link a la galería"
        description: "URL completa a una galería externa, si existe. Podés dejarlo vacío."
        type: string
        pattern:
          regex: '^$|^https?://\S+$'
          message: "Pegá una URL completa (https://…) o dejá el campo vacío."
      - name: featured
        label: "Destacado"
        description: "Marcá los shows que deben resaltarse."
        type: boolean
        default: false
      - name: draft
        label: "Borrador"
        description: "Si está activado, el show no aparece en el sitio. Usalo en vez de borrar la entrada."
        type: boolean
        default: false
      - name: needsReview
        label: "Revisión interna"
        description: "Campo interno de solo lectura."
        type: string
        readonly: true

  - name: galerias
    label: "Galerías por ciudad"
    description: "Datos opcionales de cada carpeta de fotos. Creá las ciudades desde la raíz de esta colección. Para la portada, guardá la ciudad, volvé a abrirla y usá Select dentro de su carpeta; el resto de las fotos se sube desde Media > Fotos de galería, dentro de la carpeta de la ciudad."
    type: collection
    path: content/gallery
    format: json
    subfolders: true
    filename: "{fields.city}/city.json"
    exclude: ["_TEMPLATE"]
    view:
      layout: tree
      node: city.json
      fields: [city, country, date, order]
      primary: city
      sort: [order, city, date, country]
      search: [city, country, date]
      default:
        sort: city
        order: asc
    operations:
      rename: false
    fields:
      - name: city
        label: "Ciudad"
        description: "Nombre visible de la ciudad. También define el nombre de su carpeta al crearla."
        type: string
        required: true
      - name: country
        component: pais
      - name: date
        label: "Fecha"
        description: "Fecha representativa de la visita o del show. Podés dejarla vacía."
        type: date
        default: ""
        options:
          format: "yyyy-MM-dd"
      - name: cover
        label: "Portada"
        description: "Guardá primero la ciudad y volvé a abrirla. Usá Select, entrá a la carpeta de esta ciudad y subí o elegí la foto ahí; no uses Upload directo ni arrastrarla en este campo. Si lo dejás vacío, el sitio usa una foto cover/portada/hero o la primera de la carpeta."
        type: image
        options:
          media: galeria
          path: content/gallery
          rename: safe
          extensions: [jpg, jpeg, png, webp, avif, gif, tif, tiff]
      - name: order
        label: "Orden"
        description: "Número opcional para ordenar las ciudades; menor aparece antes."
        type: number
        options:
          step: 1
      - name: description
        label: "Descripción"
        description: "Texto breve opcional sobre la ciudad o la visita."
        type: text

  - name: tracks
    label: "Tracks"
    description: "Cada track o set es una carpeta con su track.json, su audio y su portada. Creá los tracks desde la raíz de esta colección; guardá primero el track y volvé a abrirlo para subir el audio y la portada con Select dentro de su carpeta."
    type: collection
    path: content/songs
    format: json
    subfolders: true
    filename: "{fields.title}/track.json"
    exclude: ["_TEMPLATE"]
    view:
      layout: tree
      node: track.json
      fields: [title, artist, type, date, bpm, draft]
      primary: title
      sort: [date, title, artist, type]
      search: [title, artist, type, date]
      default:
        sort: date
        order: desc
    operations:
      rename: false
    fields:
      - name: title
        label: "Título"
        description: "Nombre del track o set, tal como debe aparecer en el sitio. También define el nombre de su carpeta al crearlo."
        type: string
        required: true
      - name: artist
        label: "Artista"
        description: "Nombre del artista tal como debe mostrarse en la tarjeta."
        type: string
        required: true
        default: "Tommy Petersen"
      - name: type
        label: "Tipo"
        description: "Indicá si es un tema individual, un set o un mix."
        type: select
        required: true
        default: "track"
        options:
          values:
            - name: track
              label: "Track"
            - name: set
              label: "Set"
            - name: mix
              label: "Mix"
      - name: audio
        label: "Archivo de audio"
        description: "Guardá primero el track y volvé a abrirlo. Usá Select, entrá a la carpeta de este track y subí o elegí el audio ahí; no uses Upload directo ni arrastrarlo en este campo. Si lo dejás vacío, el sitio usa el único/primer audio que encuentre en la carpeta."
        type: file
        options:
          media: tracks
          path: content/songs
          rename: safe
          extensions: [mp3, wav, m4a, aac, ogg, oga, opus, flac, aiff]
      - name: cover
        label: "Portada"
        description: "Guardá primero el track y volvé a abrirlo. Usá Select, entrá a la carpeta de este track y subí o elegí la portada ahí; no uses Upload directo ni arrastrarla en este campo. Si lo dejás vacío, el sitio usa una imagen cover/portada/hero o la primera de la carpeta."
        type: image
        options:
          media: tracks
          path: content/songs
          rename: safe
          extensions: [jpg, jpeg, png, webp, avif, gif, tif, tiff]
      - name: date
        label: "Fecha"
        description: "Fecha de publicación o grabación. Se guarda como AAAA-MM-DD y ordena los tracks; podés dejarla vacía."
        type: date
        default: ""
        options:
          format: "yyyy-MM-dd"
      - name: bpm
        label: "BPM"
        description: "Tempo en pulsos por minuto, entre 60 y 200. Podés dejarlo vacío."
        type: number
        options:
          min: 60
          max: 200
          step: 1
      - name: key
        label: "Tonalidad"
        description: "Tonalidad del track, por ejemplo Am, Fm o 8A. Podés dejarla vacía."
        type: string
      - name: genres
        label: "Géneros"
        description: "Un género por ítem, en el orden en que deben aparecer en la tarjeta."
        type: string
        list: true
      - name: colorAccent

        description: "URL pública completa del track o set en SoundCloud. Usala cuando no subís el archivo de audio: la tarjeta podrá reproducirlo embebido y también mostrará un botón para abrirlo en SoundCloud."
        type: string
        pattern:
          regex: '^$|^https?://\S+$'
          message: "Pegá una URL completa (https://…) o dejá el campo vacío."
      - name: links
        label: "Links para escuchar afuera"
        description: "URLs completas donde está publicado el track. El sitio las muestra como botones en la tarjeta, incluso cuando el audio también se reproduce en el sitio."
        type: object
        default: {}
        fields:
          - name: soundcloud
            label: "SoundCloud"
            description: "URL completa del track o set en SoundCloud."
            type: string
            pattern:
              regex: '^$|^https?://\S+$'
              message: "Pegá una URL completa (https://…) o dejá el campo vacío."
          - name: spotify
            label: "Spotify"
            description: "URL completa del track en Spotify."
            type: string
            pattern:
              regex: '^$|^https?://\S+$'
              message: "Pegá una URL completa (https://…) o dejá el campo vacío."
          - name: beatport
            label: "Beatport"
            description: "URL completa del track en Beatport."
            type: string
            pattern:
              regex: '^$|^https?://\S+$'
              message: "Pegá una URL completa (https://…) o dejá el campo vacío."
          - name: youtube
            label: "YouTube"
            description: "URL completa del video o track en YouTube."
            type: string
            pattern:
              regex: '^$|^https?://\S+$'
